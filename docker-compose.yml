version: '3.7'
services:
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: wesense-clickhouse-live
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native client interface
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
